name: Compilar APK de ZIVLO (Downgrade Flutter)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Instalar Java (Requerido para Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar versión estable compatible de Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6' # Forzamos la versión con la que el código fue escrito
          channel: 'stable'

      - name: Limpiar y Obtener Dependencias
        run: |
          flutter pub get
          flutter clean
          flutter pub get

      - name: Compilar APK (Instalador Android)
        run: flutter build apk --split-per-abi

      - name: Subir instaladores como resultado
        uses: actions/upload-artifact@v4
        with:
          name: Zivlo-APK-Forzado
          path: build/app/outputs/flutter-apk/*.apk
          
