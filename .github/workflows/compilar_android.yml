name: Reparar Gradle y Compilar APK ZIVLO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Flutter Estable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Reparar estructura obsoleta de Android
        run: |
          # Eliminamos la carpeta vieja
          rm -rf android
          # Regeneramos la carpeta nativa limpia y moderna
          flutter create . --platforms=android --org com.zivlo.app

      - name: Instalar Dependencias Actualizadas
        run: |
          flutter pub get
          flutter clean
          flutter pub get

      - name: Compilar APK (Instalador Android)
        run: flutter build apk --split-per-abi

      - name: Subir APK Resultante
        uses: actions/upload-artifact@v4
        with:
          name: Zivlo-APK-Reparado
          path: build/app/outputs/flutter-apk/*.apk
          
