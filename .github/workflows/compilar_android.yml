name: Compilar APK de ZIVLO

on:
  workflow_dispatch: # Esto te permite activar la compilación manualmente con un botón

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Instalar Java (Requerido para Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar dependencias del proyecto
        run: flutter pub get

      - name: Compilar APK (Instalador Android)
        run: flutter build apk --split-per-abi

      - name: Subir instaladores como resultado
        uses: actions/upload-artifact@v4
        with:
          name: Zivlo-Instaladores-APK
          path: build/app/outputs/flutter-apk/*.apk
          
