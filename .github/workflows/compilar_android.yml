name: Compilar APK ZIVLO Estructura Kotlin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Flutter Estable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Reparar estructura obsoleta de Android
        run: |
          # 1. Eliminamos la carpeta vieja que causa el error de Gradle soportado
          rm -rf android
          
          # 2. Regeneramos la carpeta nativa limpia con la estructura moderna
          flutter create . --platforms=android --org com.zivlo.app

      - name: Instalar Dependencias Actualizadas
        run: |
          flutter pub get
          flutter clean
          flutter pub get

      - name: Compilar APK (Instalador Android)
        run: flutter build apk --split-per-abi

      - name: Subir APK Resultante
        uses: actions/upload-artifact@v4
        with:
          name: Zivlo-APK-Final
          path: build/app/outputs/flutter-apk/*.apk
          
