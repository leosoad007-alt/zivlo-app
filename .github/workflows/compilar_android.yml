name: Forzar SDK 34 y Compilar APK ZIVLO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Flutter Estable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Reparar estructura y Forzar Android SDK 34
        run: |
          # 1. Eliminamos la carpeta vieja
          rm -rf android
          
          # 2. Regeneramos la carpeta nativa limpia
          flutter create . --platforms=android --org com.zivlo.app
          
          # 3. Forzamos el SDK de Android 34 en el build.gradle recién creado
          sed -i 's/compileSdk = .*/compileSdk = 34/g' android/app/build.gradle
          sed -i 's/targetSdk = .*/targetSdk = 34/g' android/app/build.gradle

      - name: Instalar Dependencias Actualizadas
        run: |
          flutter pub get
          flutter clean
          flutter pub get

      - name: Compilar APK (Instalador Android)
        run: flutter build apk --split-per-abi

      - name: Subir APK Resultante
        uses: actions/upload-artifact@v4
        with:
          name: Zivlo-APK-Reparado
          path: build/app/outputs/flutter-apk/*.apk
          
