name: Compilar APK de ZIVLO Definitivo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Instalar Java (Requerido para Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Limpiar y Obtener Dependencias
        run: |
          flutter pub get
          flutter clean
          flutter pub get

      - name: Forzar compatibilidad de SDK y Gradle
        run: |
          # Si la carpeta android existe, nos aseguramos de que acepte compilaciones sin firmar
          if [ -d "android" ]; then
            find android/ -name "build.gradle" -exec sed -i 's/minifyEnabled true/minifyEnabled false/g' {} +
          else
            flutter create . --platforms=android
          fi

      - name: Compilar APK (Modo Release sin restricciones)
        run: flutter build apk --no-shrink --split-per-abi

      - name: Subir instaladores como resultado
        uses: actions/upload-artifact@v4
        with:
          name: Zivlo-APK-Final
          path: build/app/outputs/flutter-apk/*.apk
          
